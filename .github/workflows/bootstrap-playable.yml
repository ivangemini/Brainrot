name: Bootstrap First Playable

on:
  push:
    branches:
      - codex/playable-v1c
    paths:
      - .github/workflows/bootstrap-playable.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/playable-v1c
          fetch-depth: 0

      - name: Restore playable source bundle
        shell: bash
        run: |
          cat > /tmp/playable.b64 <<'PAYLOAD'
          
          PAYLOAD
          tr -d '[:space:]' < /tmp/playable.b64 | base64 -d > /tmp/playable.tar.gz
          tar -xzf /tmp/playable.tar.gz -C .
          rm -f src/.gitkeep

      - name: Enforce raster-only art contract
        shell: python
        run: |
          from pathlib import Path
          path = Path('design/art/art-bible.md')
          text = path.read_text()
          text = text.replace(
              '- SVG allowed for simple UI icons/logos only when rasterization/performance remains predictable; do not build the runtime world as SVG-heavy placeholder art.',
              '- SVG is prohibited for production art, including UI illustration/icon assets. Use generated raster PNG/WebP assets only; HTML/CSS remains limited to layout, typography and interaction surfaces.'
          )
          path.write_text(text)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate first raster texture pack
        run: |
          python -m pip install --disable-pip-version-check pillow numpy
          python tools/art/generate_raster_assets.py

      - name: Commit playable bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: complete first raster playable slice"
            git push origin HEAD:codex/playable-v1c
          fi
