name: Codex semantic cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply semantic cleanup
        run: python scripts/semantic_cleanup.py

      - name: Validate semantic contract
        run: |
          test -f AGENTS.md
          test ! -e .claude
          test ! -e CLAUDE.md
          test "$(find agents -maxdepth 1 -name '*.md' | wc -l)" -eq 49
          test "$(find skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)" -eq 73
          test "$(grep -Rl 'Codex role-profile semantics' agents | wc -l)" -eq 49
          test "$(grep -Rl 'Codex skill execution semantics' skills --include='SKILL.md' | wc -l)" -eq 73
          RESIDUAL=$(grep -RIl --exclude-dir=.git -E 'May I write|Get approval before writing files|Wait for "yes" before using Write/Edit|AskUserQuestion|allowed-tools:|model: (sonnet|opus|haiku)' agents skills 2>/dev/null || true)
          if [ -n "$RESIDUAL" ]; then
            echo 'Residual incompatible semantics:'
            echo "$RESIDUAL" | head -30
            exit 1
          fi

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: align all studio roles and skills with Codex autonomy"
          git push origin HEAD:main
