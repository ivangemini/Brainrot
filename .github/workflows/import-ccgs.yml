name: Import CCGS framework

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Claude Code Game Studios
        run: git clone --depth 1 https://github.com/Donchitos/Claude-Code-Game-Studios.git /tmp/ccgs

      - name: Copy framework files
        run: |
          rsync -a --exclude='.git' /tmp/ccgs/ ./
          rm -rf /tmp/ccgs

      - name: Commit imported framework
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: import Claude Code Game Studios framework"
          git push origin HEAD:main
