name: Adapt CCGS for Codex-only use

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  adapt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Adapt framework
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, re

          root = Path('.')

          # Preserve upstream historical docs before rewriting the working framework.
          upstream = root / 'docs' / 'upstream'
          upstream.mkdir(parents=True, exist_ok=True)
          for src_name, dst_name in [
              ('README.md', 'CCGS-README.md'),
              ('UPGRADING.md', 'CCGS-UPGRADING.md'),
          ]:
              src = root / src_name
              if src.exists():
                  shutil.copy2(src, upstream / dst_name)

          # Neutral, Codex-readable layout.
          moves = [
              (root / '.claude' / 'agents', root / 'agents'),
              (root / '.claude' / 'skills', root / 'skills'),
              (root / '.claude' / 'rules', root / 'rules'),
              (root / '.claude' / 'hooks', root / 'scripts' / 'hooks'),
              (root / '.claude' / 'docs', root / 'studio' / 'docs'),
              (root / '.claude' / 'agent-memory', root / 'production' / 'agent-memory'),
          ]
          for src, dst in moves:
              if src.exists():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  if dst.exists():
                      shutil.rmtree(dst)
                  shutil.move(str(src), str(dst))

          testing = root / 'CCGS Skill Testing Framework'
          if testing.exists():
              dst = root / 'Studio Skill Testing Framework'
              if dst.exists():
                  shutil.rmtree(dst)
              shutil.move(str(testing), str(dst))

          # Remove Claude runtime-only configuration. The reusable hook scripts remain under scripts/hooks.
          for p in [root / '.claude' / 'settings.json', root / '.claude' / 'statusline.sh', root / 'CLAUDE.md']:
              if p.exists():
                  p.unlink()
          claude_dir = root / '.claude'
          if claude_dir.exists():
              shutil.rmtree(claude_dir)

          # Remove upstream repository governance files that should not control this game repository.
          for p in [
              root / '.github' / 'CODEOWNERS',
              root / '.github' / 'FUNDING.yml',
              root / '.github' / 'PULL_REQUEST_TEMPLATE.md',
              root / '.github' / 'ISSUE_TEMPLATE',
          ]:
              if p.is_dir():
                  shutil.rmtree(p)
              elif p.exists():
                  p.unlink()

          path_replacements = [
              ('.claude/agents/', 'agents/'),
              ('.claude/skills/', 'skills/'),
              ('.claude/rules/', 'rules/'),
              ('.claude/hooks/', 'scripts/hooks/'),
              ('.claude/docs/', 'studio/docs/'),
              ('.claude/agent-memory/', 'production/agent-memory/'),
              ('CCGS Skill Testing Framework', 'Studio Skill Testing Framework'),
              ('CLAUDE.md', 'AGENTS.md'),
          ]

          wording_replacements = [
              ('Claude Code Game Studios', 'Codex Game Studio Framework'),
              ('Claude Code Game Studio', 'Codex Game Studio Framework'),
              ('Claude Code', 'Codex'),
              ('AskUserQuestion', 'user-decision checkpoint'),
              ('sub-agents', 'role profiles'),
              ('subagents', 'role profiles'),
              ('sub-agent', 'role profile'),
              ('subagent', 'role profile'),
              ('spawned agent', 'activated role'),
              ('spawned agents', 'activated roles'),
              ('spawn an agent', 'activate a role profile'),
              ('spawn the agent', 'activate the role profile'),
              ('spawn agents', 'activate role profiles'),
              ('spawn agent', 'activate role profile'),
              ('via Task', 'by activating the relevant role profile'),
              ('using Task', 'using role routing'),
              ('Task tool', 'role-routing mechanism'),
          ]

          def strip_claude_frontmatter(text: str) -> str:
              if not text.startswith('---\n'):
                  return text
              end = text.find('\n---\n', 4)
              if end == -1:
                  return text
              fm = text[4:end].splitlines()
              blocked = ('tools:', 'allowed-tools:', 'model:', 'maxTurns:', 'permissionMode:', 'memory:')
              fm = [line for line in fm if not line.lstrip().startswith(blocked)]
              return '---\n' + '\n'.join(fm) + '\n---\n' + text[end+5:]

          # Rewrite all UTF-8 text except the legal license and untouched upstream snapshots.
          skip_prefixes = {str(upstream / 'CCGS-README.md'), str(upstream / 'CCGS-UPGRADING.md')}
          for p in root.rglob('*'):
              if not p.is_file() or p == root / 'LICENSE' or str(p) in skip_prefixes:
                  continue
              if '.git/' in str(p):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              original = text
              for a, b in path_replacements:
                  text = text.replace(a, b)
              for a, b in wording_replacements:
                  text = text.replace(a, b)
              if p.match('agents/*.md') or ('skills' in p.parts and p.name == 'SKILL.md'):
                  text = strip_claude_frontmatter(text)
              # Single-agent semantics: role profiles are instructions applied by Codex itself.
              text = text.replace('use `Task`', 'activate the relevant role profile')
              text = text.replace('Use `Task`', 'Activate the relevant role profile')
              text = text.replace('Task(', 'role-routing(')
              if text != original:
                  p.write_text(text, encoding='utf-8')

          agents_md = r'''# AGENTS.md — Brainrot Game Project

This file is the canonical operating contract for the only coding agent working in this repository: OpenAI Codex / ChatGPT.

## Operating model

This repository uses a **single-agent studio model**. Files under `agents/` are role profiles, not independent AI processes. Do not claim that another agent was spawned, consulted, or executed. Instead, when a task touches a domain, read the relevant role profile and apply that expertise yourself in the same working session.

Examples:
- gameplay implementation -> `agents/gameplay-programmer.md`
- systems/economy -> `agents/systems-designer.md`, `agents/economy-designer.md`
- visual direction -> `agents/art-director.md`, `agents/technical-artist.md`
- UX/UI -> `agents/ux-designer.md`, `agents/ui-programmer.md`
- QA/release -> `agents/qa-lead.md`, `agents/release-manager.md`
- architecture/performance -> `agents/technical-director.md`, `agents/lead-programmer.md`, `agents/performance-analyst.md`

Role hierarchy is for reasoning and review order, not process isolation.

## Skill routing

Reusable workflows live under `skills/<skill-name>/SKILL.md`. When the user asks for work that clearly maps to a skill, read that skill before editing. Slash-prefixed names in documentation are workflow names, not a requirement for a special Claude command system.

For large implementation passes, prefer this sequence when applicable:
1. inspect current project state and source-of-truth docs;
2. identify the relevant skill(s) and role profile(s);
3. implement the complete coherent slice;
4. run the applicable verification;
5. review the result from gameplay, UX/art, performance and QA perspectives;
6. update roadmap/session-state/docs if behavior or architecture changed.

## Autonomy

The user has selected Codex as the sole implementation agent for this project. Once the user gives a clear task, work autonomously through the full coherent pass.

Do **not** request approval for routine file writes, multi-file edits, tests, refactors within scope, or other reversible implementation details. Do not stop after the first small fix when the requested pass clearly contains more work.

Ask the user only when a genuinely product-defining choice cannot be inferred safely, an irreversible/destructive action is required, credentials/payment/legal acceptance are involved, or two materially different directions would change the game itself. Otherwise choose the best-supported option, document the assumption, and continue.

Where imported skills contain a `user-decision checkpoint`, interpret it using this autonomy rule: block only for a material decision; otherwise proceed with the recommended/default option and record it.

## Source of truth

Until a game concept is selected, this repository is a pre-production studio framework. Do not invent a final game concept, engine, art direction, economy, or platform target unless the user asks to begin concept/design work.

Once created, project-specific source-of-truth documents override generic framework examples. In conflicts, use this precedence:
1. latest explicit user instruction;
2. this `AGENTS.md`;
3. project-specific design/architecture/roadmap documents;
4. relevant `skills/` workflow;
5. relevant `agents/` role profile;
6. generic framework/reference documentation.

## Directory semantics

- `agents/` — role profiles applied by the single Codex agent.
- `skills/` — reusable workflows and checklists.
- `rules/` — coding/design rules; read the rules relevant to files being changed.
- `scripts/hooks/` — reusable validation/session scripts. They are **not automatically executed** by Codex; invoke useful validators explicitly when applicable.
- `studio/docs/` — framework workflow catalog, templates and technical preferences.
- `production/` — sprint/session/release state.
- `design/` — game design artifacts.
- `docs/` — technical/project documentation and upstream attribution.
- `src/`, `assets/`, `tests/`, `tools/`, `prototypes/` — project implementation areas once development begins.

## Session continuity

Use `production/session-state/active.md` as persistent working context for long or multi-turn tasks. Update it after substantial implementation passes with completed work, decisions, blockers and the next logical step. This is the replacement for Claude-specific compaction/session hooks.

## Quality discipline

A task is not complete merely because files were edited. Apply the applicable quality gates from the project and imported framework:
- correctness and acceptance criteria;
- deterministic tests where practical;
- visual/interaction review for player-facing changes;
- performance implications;
- save/data compatibility where relevant;
- platform constraints where relevant;
- documentation/roadmap consistency;
- no placeholders in a path presented as production-ready.

Never claim a test, build, browser check, benchmark or validation passed unless it was actually run successfully.

## Git discipline

Keep changes coherent. Never force-push, expose secrets, or intentionally destroy unrelated work. Imported scripts under `scripts/hooks/` are advisory/explicit utilities unless a project-specific workflow wires them into CI later.

## Framework provenance

This project was bootstrapped from Donchitos/Claude-Code-Game-Studios v1.0.0 under the MIT License. The original license is preserved in `LICENSE`; upstream reference snapshots are retained under `docs/upstream/`. The active operating model in this repository is Codex-only and is defined by this file.
'''
          (root / 'AGENTS.md').write_text(agents_md, encoding='utf-8')

          adaptation = r'''# Codex Adaptation

This repository started from Claude Code Game Studios v1.0.0 and was converted to a single-agent Codex workflow.

## Structural changes

- `.claude/agents/` -> `agents/`
- `.claude/skills/` -> `skills/`
- `.claude/rules/` -> `rules/`
- `.claude/hooks/` -> `scripts/hooks/`
- `.claude/docs/` -> `studio/docs/`
- `.claude/agent-memory/` -> `production/agent-memory/`
- `CLAUDE.md` -> replaced by canonical root `AGENTS.md`
- Claude settings/statusline removed

## Semantic changes

There is one executor: Codex/ChatGPT. Agent definitions are role profiles that the executor reads and applies. Imported multi-agent routing language is interpreted as role switching, not as evidence that independent agents ran.

Claude-specific tool metadata (`model`, `allowed-tools`, agent `tools`, `maxTurns`) was removed from active role/skill frontmatter. Claude-specific decision-tool references were converted to ordinary user-decision checkpoints governed by the autonomy policy in `AGENTS.md`.

Hook scripts remain as reusable utilities but are not assumed to run automatically. Validation that matters must be invoked explicitly or later wired into CI.

## Upstream

Original upstream snapshots are retained in `docs/upstream/`. `LICENSE` remains the original MIT license and attribution.
'''
          (root / 'studio' / 'CODEX_ADAPTATION.md').parent.mkdir(parents=True, exist_ok=True)
          (root / 'studio' / 'CODEX_ADAPTATION.md').write_text(adaptation, encoding='utf-8')

          readme = r'''# Brainrot

Pre-production game repository using a **Codex-only game studio workflow**.

The project is intentionally not committed to a game concept or engine yet. The current repository provides the production framework we will use to design, build, review, test and ship the game after the concept is chosen.

## How the studio works

- `AGENTS.md` is the canonical instruction file for Codex/ChatGPT.
- `agents/` contains 49 specialist role profiles. They are reasoning lenses used by the single Codex agent, not separate running agents.
- `skills/` contains the imported production workflows for design, architecture, implementation, QA, art, UX, release and live operations.
- `rules/` contains domain/path quality rules.
- `scripts/hooks/` contains reusable validators and session utilities; they are explicit scripts, not automatic Claude hooks.
- `studio/docs/` contains workflow catalogs, templates and framework references.
- `production/`, `design/`, `docs/`, `src/`, `assets/`, `tests/`, `tools/`, and `prototypes/` are the working project areas.

See `studio/CODEX_ADAPTATION.md` for the compatibility changes and `docs/upstream/` for preserved upstream reference material.

## Current stage

**Framework setup / concept not selected.**

The next project step is to discuss and choose the game concept. Do not treat any generic CCGS example as the design of this game.

## License and provenance

Bootstrapped from Donchitos/Claude-Code-Game-Studios v1.0.0 under the MIT License. See `LICENSE` and `docs/upstream/`.
'''
          (root / 'README.md').write_text(readme, encoding='utf-8')

          # Rewrite gitignore's Claude-local section into neutral project-local ignores.
          gi = root / '.gitignore'
          if gi.exists():
              text = gi.read_text(encoding='utf-8')
              text = text.replace('# === Claude Code Local ===\n.claude/settings.local.json\nCLAUDE.local.md\n', '# === Agent / Local Workspace ===\nAGENTS.local.md\n.studio-local/\n')
              gi.write_text(text, encoding='utf-8')

          # Remove the one-shot workflow itself from the resulting commit.
          wf = root / '.github' / 'workflows' / 'adapt-codex.yml'
          if wf.exists():
              wf.unlink()
          try:
              (root / '.github' / 'workflows').rmdir()
          except OSError:
              pass
          PY

      - name: Validate adaptation
        shell: bash
        run: |
          test -f AGENTS.md
          test -d agents
          test -d skills
          test -d rules
          test -d scripts/hooks
          test -d studio/docs
          test ! -e .claude
          test ! -e CLAUDE.md
          test -f LICENSE
          echo "Agents: $(find agents -maxdepth 1 -name '*.md' | wc -l)"
          echo "Skills: $(find skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)"
          if grep -RIl --exclude-dir=.git --exclude='CCGS-README.md' --exclude='CCGS-UPGRADING.md' -E '\.claude/|CLAUDE\.md|AskUserQuestion|allowed-tools:|model: (sonnet|opus|haiku)' agents skills rules studio scripts production design docs src 2>/dev/null | head -1 | grep -q .; then
            echo 'Residual active Claude-specific references found:'
            grep -RIl --exclude-dir=.git --exclude='CCGS-README.md' --exclude='CCGS-UPGRADING.md' -E '\.claude/|CLAUDE\.md|AskUserQuestion|allowed-tools:|model: (sonnet|opus|haiku)' agents skills rules studio scripts production design docs src 2>/dev/null | head -20
            exit 1
          fi

      - name: Commit adaptation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: adapt game studio framework for Codex"
          git push origin HEAD:main
