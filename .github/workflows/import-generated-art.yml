name: Import Generated Art

on:
  push:
    branches:
      - codex/generated-art-runtime-v2
    paths:
      - 'staging/runtime-art/**'
      - '.github/workflows/import-generated-art.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild generated hero asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/generated
          cat staging/runtime-art/main_*.b64 | base64 --decode > public/assets/generated/main_scene_hero.webp
          test "$(stat -c%s public/assets/generated/main_scene_hero.webp)" -eq 26332
          file public/assets/generated/main_scene_hero.webp | grep -qi 'Web/P image'
      - name: Clean staging and self-remove workflow
        shell: bash
        run: |
          rm -rf staging/runtime-art
          rm -f .github/workflows/import-generated-art.yml
      - name: Commit generated art
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'art: import generated production hero scene'
          git push origin HEAD:codex/generated-art-runtime-v2
