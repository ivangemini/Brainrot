name: Adapt CCGS for Codex

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  adapt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run adaptation
        run: |
          python scripts/adapt_codex.py
          python scripts/adapt_codex_cleanup.py

      - name: Validate adaptation
        run: |
          test -f AGENTS.md
          test -d agents
          test -d skills
          test -d rules
          test -d scripts/hooks
          test -d studio/docs
          test ! -e .claude
          test ! -e CLAUDE.md
          test -f LICENSE
          echo "Agents: $(find agents -maxdepth 1 -name '*.md' | wc -l)"
          echo "Skills: $(find skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)"
          RESIDUAL=$(grep -RIl --exclude-dir=.git --exclude='CCGS-README.md' --exclude='CCGS-UPGRADING.md' --exclude='CODEX_ADAPTATION.md' -E '\.claude/|CLAUDE\.md|AskUserQuestion|allowed-tools:|model: (sonnet|opus|haiku)' agents skills rules studio scripts production design docs src 2>/dev/null || true)
          if [ -n "$RESIDUAL" ]; then
            echo 'Residual active Claude-specific references found'
            echo "$RESIDUAL" | head -20
            exit 1
          fi

      - name: Commit adaptation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: adapt game studio framework for Codex"
          git push origin HEAD:main
