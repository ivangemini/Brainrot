name: Exact CCGS snapshot sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone CCGS
        run: |
          git clone --depth 1 https://github.com/Donchitos/Claude-Code-Game-Studios.git /tmp/ccgs
          (cd /tmp/ccgs && git ls-files -z > /tmp/ccgs-files)

      - name: Mirror source snapshot
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows/sync-ccgs.yml' \
            /tmp/ccgs/ ./

          git add -A
          git add -f --pathspec-from-file=/tmp/ccgs-files --pathspec-file-nul

      - name: Commit exact snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync exact CCGS tracked snapshot"
          git push origin HEAD:main
